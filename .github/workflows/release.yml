name: Build & Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting, lint and tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      - name: Build release executable
        run: cargo build --release

      - name: Download FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
        with:
          ffmpeg-version: release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/LoopKaraokeStudio"
          New-Item -ItemType Directory -Force "$dist/assets" | Out-Null
          Copy-Item target/release/loopkaraoke-studio.exe "$dist/LoopKaraokeStudio.exe"
          Copy-Item -Recurse assets/effects "$dist/assets/effects"
          $ffmpegDir = Split-Path (Get-Command ffmpeg).Source
          Copy-Item "$ffmpegDir/ffmpeg.exe", "$ffmpegDir/ffprobe.exe" $dist
          Compress-Archive -Path $dist -DestinationPath dist/LoopKaraokeStudio-Windows-x64.zip

      - name: Upload build artifact (manual run)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LoopKaraokeStudio-Windows-x64
          path: dist/LoopKaraokeStudio-Windows-x64.zip

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "LoopKaraoke Studio ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/LoopKaraokeStudio-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-cuda:
    name: Build Windows Desktop App (NVIDIA CUDA)
    # CUDA 12.6 supports Visual Studio 2017-2022 only; windows-latest ships VS 2026.
    runs-on: windows-2022
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # The runner has no GPU, so list target architectures instead of "native".
      CMAKE_CUDA_ARCHITECTURES: "61;75;86;89"
      # Ninja calls nvcc directly; the Visual Studio generator needs the CUDA
      # MSBuild integration, which is not found on the runner ("No CUDA toolset found").
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cuda

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit (build tools only)
        uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda
        with:
          cuda: '12.6.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Build release executable
        run: cargo build --release --features cuda

      - name: Download FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/LoopKaraokeStudio"
          New-Item -ItemType Directory -Force "$dist/assets" | Out-Null
          Copy-Item target/release/loopkaraoke-studio.exe "$dist/LoopKaraokeStudio.exe"
          Copy-Item -Recurse assets/effects "$dist/assets/effects"
          $ffmpegDir = Split-Path (Get-Command ffmpeg).Source
          Copy-Item "$ffmpegDir/ffmpeg.exe", "$ffmpegDir/ffprobe.exe" $dist
          # Runtime DLLs so users only need the NVIDIA driver, not the toolkit.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          Copy-Item "$cudaBin/cudart64_*.dll", "$cudaBin/cublas64_*.dll", "$cudaBin/cublasLt64_*.dll" $dist
          Compress-Archive -Path $dist -DestinationPath dist/LoopKaraokeStudio-Windows-x64-CUDA.zip

      - name: Upload CUDA build artifact (manual run)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: LoopKaraokeStudio-Windows-x64-CUDA
          path: dist/LoopKaraokeStudio-Windows-x64-CUDA.zip

      - name: Upload CUDA build to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "LoopKaraoke Studio ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: dist/LoopKaraokeStudio-Windows-x64-CUDA.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
